customHeaders:
  - pattern: '**'
    headers:
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:; connect-src https://formspree.io; form-action https://formspree.io;"
  - pattern: '**/*.@(css|js|png|jpg|jpeg|gif|ico|webp|woff|woff2|ttf|svg|pdf)'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
