name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: george-koufie-portfolio

jobs:

  # ── Job: Validate ─────────────────────────────────────────────
  # Deployment itself is handled by AWS Amplify Hosting's native Git
  # integration (auto-builds/deploys on push once the repo is connected
  # in the Amplify console) — this job only sanity-checks the local
  # Docker preview image used for development.
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image (local preview)
        run: docker build -t $IMAGE_NAME:test .

      - name: Validate nginx config
        run: docker run --rm $IMAGE_NAME:test nginx -t
